<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portland Move</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<!--
  Portland move board (6 Oct 2026). Private: Supabase Auth sign-in, and row level
  security lets only addresses on move_editors read or change anything. Tabs are
  rows in move_rows (one table, data jsonb holds the cells), so a new column needs
  no database change. The page never deletes: it archives, and every edit first
  copies the earlier row to move_versions. The Jobs tab reads the job scan tables.
  Rentals and Houses to buy also get homes from the Zillow alert emails (source
  'zillow', loaded by load_listing_emails.py outside this repo). Those wait in a New
  list at the top of the tab: Save sets them to Like, Pass archives them. The Map tab
  shows them as pins (positions from the Census geocoder, kept in data._lat, _lon and
  _geo by the same script) with the six schools, on the LSRI lab's live map.
  Same look as the Oregon Sound Circuit notebook. Local preview with demo data:
  http://localhost:PORT/move/?demo (localhost only, nothing is saved).
-->
<style>
:root{--ink:#1B2430;--slate:#566070;--ink3:#646B78;--paper:#FBF8F3;--card:#FFFFFF;--mist:#F3EEE6;
  --rule:#E7E1D7;--rule2:#D5CDBF;--line2:rgba(27,36,48,.24);
  --navy:#0F2742;--navy2:#1D3E63;--sky:#C9D6E3;--teal:#0A8F9C;--teal-t:#086670;--teal-tint:#E6F1F1;
  --coral:#E8603C;--coral-t:#A63D1C;--amber:#F2B33D;--amber-t:#7A4F00;
  --serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--teal-t);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-t);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;border-radius:10px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.quiet{border-color:var(--line2)}
.btn.small{padding:5px 12px;font-size:14.5px}
.btn:disabled{opacity:.6;cursor:default}
.btn-w{background:none;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:5px 12px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-w:hover{background:rgba(255,255,255,.1)}
.mini{background:none;border:0;padding:3px 7px;font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;border-radius:7px;white-space:nowrap}
.mini:hover{background:var(--mist);color:var(--ink)}
.mini.warn{color:var(--coral-t)}
.addrow{display:block;width:100%;margin:14px 0 0;background:none;border:1.5px dashed var(--rule2);border-radius:14px;padding:12px;font-size:15.5px;font-weight:600;color:var(--slate);cursor:pointer;text-align:center}
.addrow:hover{border-color:var(--teal);color:var(--teal-t);background:#fff}

/* sign in and notices */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{width:min(460px,100%);background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:30px 30px 26px}
.gate-card h1{font:500 40px/1.05 var(--serif);margin:6px 0 8px;letter-spacing:-.015em}
.gate-card p{margin:0 0 18px;color:var(--slate);font-size:16.5px}
.eyebrow{font:500 13px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-t);margin:0}
.fld{display:block;margin:0 0 14px}
.fld span{display:block;font-size:14px;font-weight:600;margin:0 0 5px}
.fld input{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:16px;background:#fff}
.err{background:#FBE9E2;border-left:4px solid var(--coral);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px;color:var(--ink);margin:0 0 16px}
.demo{background:#FFF7E3;border-bottom:1px solid #EBD9A8;font-size:14px;text-align:center;padding:7px 16px}

/* masthead and cover */
.mast{background:var(--navy);color:#fff}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px}
.brand{font:500 13px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.mast-r{display:flex;align-items:center;gap:14px;font-size:14px;color:#D5DEE8;min-width:0}
.mast-r .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover{background:var(--navy);color:#fff;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.08)}
.cover::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 88% -10%,rgba(10,143,156,.35),transparent 60%),radial-gradient(700px 380px at 105% 110%,rgba(242,179,61,.16),transparent 60%)}
.cover .wrap{position:relative;padding-top:26px;padding-bottom:28px}
.cover .eyebrow{color:#B8CADB}
.cover h1{font:500 46px/1.05 var(--serif);letter-spacing:-.02em;margin:10px 0 8px}
.cover .sub{font-size:17px;color:#D5DEE8;max-width:760px;margin:0}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 0}
.meta button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 16px 14px;text-align:left;color:#fff;cursor:pointer;min-width:0}
.meta button:hover{background:rgba(255,255,255,.13)}
.meta .k{display:block;font:500 12.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#B8CADB}
.meta b{display:block;font:500 28px/1.15 var(--serif);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .s{display:block;font-size:14px;color:#D5DEE8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs */
.tbar{position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:1px solid var(--rule2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:16px 12px 13px;font-size:15.5px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--teal)}
.tab .n{display:inline-block;min-width:24px;margin-left:6px;padding:0 7px;border-radius:10px;background:var(--mist);color:var(--ink);font-size:13px;font-weight:600;text-align:center}
.tab.on .n{background:var(--teal-tint);color:var(--teal-t)}

/* a tab */
main{padding:22px 0 90px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.head h2{font:500 32px/1.15 var(--serif);letter-spacing:-.01em;margin:0}
.blurb{color:var(--slate);margin:0 0 14px;max-width:780px}
.tools{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 14px}
.tools input[type=search],.tools select{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:7px 11px;font-size:15px}
.tools input[type=search]{width:230px}
.tools label.tg{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--slate);cursor:pointer}
.tools label.tg input{width:17px;height:17px;accent-color:var(--teal)}
.tools .sp{flex:1 1 auto}
.save{font:500 12.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.save.bad{color:var(--coral-t)}
.empty{background:var(--card);border:1px dashed var(--rule2);border-radius:16px;padding:22px;color:var(--slate)}

/* the sheet */
.sheet-wrap{position:relative;overflow-x:auto;border:1px solid var(--rule);border-radius:14px;background:var(--card)}
table.sheet{border-collapse:collapse;width:100%}
.sheet th{background:var(--mist);text-align:left;font:500 12.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0;border-bottom:1px solid var(--rule2);white-space:nowrap}
.sheet th button{background:none;border:0;width:100%;text-align:left;padding:11px 10px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.sheet th button:hover{color:var(--ink)}
.sheet th .arr{color:var(--teal-t)}
.sheet td{border-bottom:1px solid var(--rule);padding:3px 4px;vertical-align:top}
.sheet tbody tr:last-child td{border-bottom:0}
.cv{display:flex;align-items:center;gap:4px;min-width:0}
.sheet input,.sheet select,.sheet textarea{width:100%;min-width:0;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-size:15px;line-height:1.4}
.sheet input:hover,.sheet select:hover,.sheet textarea:hover{border-color:var(--rule2)}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--teal);background:#fff;outline:none}
.sheet textarea{resize:none;overflow:hidden;display:block;min-height:36px}
.sheet input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);margin:8px;flex:none}
.sheet .cur{color:var(--slate);padding-left:6px}
.sheet .open{font-size:13.5px;font-weight:600;white-space:nowrap;padding:0 6px}
.sheet td.rt{white-space:nowrap;text-align:right;vertical-align:middle;padding-right:8px}
.edited{display:block;font:500 12px/1.3 var(--mono);color:var(--ink3);letter-spacing:.03em}
.sheet tr.done td{background:#F7F4EE}
.sheet tr.done input:not([type=checkbox]),.sheet tr.done textarea,.sheet tr.done select{color:var(--slate)}
.sheet tr.fresh td{background:var(--teal-tint)}
.sheet tr.arch td{background:var(--mist)}
.sheet tr.arch .cv{opacity:.6}

/* jobs */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--line2);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip .c{font:500 13px/1.4 var(--mono);color:var(--ink3)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .c{color:var(--sky)}
.job{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;margin:0 0 10px}
.job h3{font:500 21px/1.25 var(--serif);margin:0 0 3px}
.job h3 a{color:var(--ink);text-decoration:none}
.job h3 a:hover{color:var(--teal-t);text-decoration:underline}
.jm{color:var(--slate);font-size:14.5px;margin:0 0 10px}
.jd{font-size:14.5px;color:var(--slate);margin:0 0 10px;max-height:6.3em;overflow:hidden}
.pill{display:inline-block;font:500 12px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--slate)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* the New list on Rentals and Houses to buy */
.queue{background:var(--teal-tint);border:1px solid #C7E0E0;border-radius:16px;padding:14px 14px 16px;margin:0 0 22px}
.qh{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.qh h3,.lh{font:500 22px/1.2 var(--serif);margin:0}
.qh .c{font:500 13px/1.4 var(--mono);background:var(--card);border:1px solid #C7E0E0;color:var(--teal-t);border-radius:10px;padding:1px 9px}
.lh{margin:0 0 10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.qgrid .job{margin:0;display:flex;flex-direction:column}
.qgrid .acts{margin-top:auto}
.lp{font-size:16px;font-weight:600;margin:0 0 6px}
.lx{font-size:14.5px;color:var(--ink);margin:0 0 5px}

/* the Map tab */
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{background:none;border:0;padding:7px 12px;font-size:15px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.mapwrap{position:relative;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--mist)}
.mapbox{height:min(68vh,720px);min-height:380px}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--slate);background:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 2px 0;font-size:14px;color:var(--slate)}
.legend>span{display:inline-flex;align-items:center;gap:4px}
.mapnote{color:var(--slate);font-size:14.5px;margin:6px 2px 0;max-width:900px}
.pin{display:block;width:30px;height:30px;position:relative;cursor:pointer}
.pin i{position:absolute;inset:7px;border-radius:50%;background:var(--teal);border:2.5px solid #fff;box-shadow:0 1px 3px rgba(15,39,66,.4)}
.pin.new i{background:#fff;border:3.5px solid var(--teal)}
.pin.buy i{border-radius:4px;background:var(--coral)}
.pin.buy.new i{background:#fff;border-color:var(--coral)}
.pin.school{width:26px;height:26px}
.pin.school i{inset:7px;border-radius:2px;transform:rotate(45deg);background:var(--navy);border:2px solid #fff}
.pin.school span{position:absolute;left:23px;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 12.5px/1.2 var(--sans);color:var(--navy);background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px;box-shadow:0 1px 2px rgba(15,39,66,.2)}
.pin.dim{opacity:.35}
.pin:focus-visible{outline:2px solid var(--teal-t);outline-offset:1px;border-radius:50%}
.legend .pin{display:inline-block;width:22px;height:22px;cursor:default}
.legend .pin i{inset:3px}
.legend .pin.school i{inset:5px}
.mapbox .maplibregl-popup-content{font:15px/1.45 var(--sans);color:var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(15,39,66,.22)}
.mapbox .maplibregl-popup-close-button{font-size:20px;width:30px;height:30px;color:var(--slate);border-radius:0 12px 0 8px}
.pop h3{font:500 19px/1.25 var(--serif);margin:0 0 4px;padding-right:20px}
.pop h3 a{color:var(--ink);text-decoration:none}
.pop h3 a:hover{color:var(--teal-t);text-decoration:underline}
.pop .pk{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-t);margin:0 0 3px}
.pop .lp{font-size:15px;font-weight:600;margin:0 0 5px}
.pop .lx{font-size:14px;margin:0 0 4px}
.pop .jm{font-size:13.5px;margin:0 0 9px}
.pop .acts{gap:6px;margin:0 0 8px}
.pop .pl{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:14px;font-weight:600}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--teal-t);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.job.hl{outline:2.5px solid var(--teal);outline-offset:2px}

/* undo toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:15px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
.toast button{background:none;border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:3px 10px;font-weight:600;cursor:pointer}

@media (max-width:860px){
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .cover h1{font-size:34px}
  .cover .sub{font-size:16px}
  .meta b{font-size:22px}
  .meta .k,.save,.pill,.chip .c{font-size:13px}
  .mast-r .who{display:none}
  .tools input[type=search]{width:100%}
  .queue{padding:12px 10px 12px}
  .mapbox{height:62vh;min-height:320px}
  .seg button{padding:7px 10px;font-size:14.5px}
  .qgrid{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:27px}
  .sheet-wrap{overflow:visible;border:0;background:none}
  table.sheet,.sheet tbody,.sheet tr,.sheet td{display:block;width:100%}
  .sheet thead{display:none}
  .sheet tr{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:8px 12px;margin:0 0 12px}
  .sheet td{border:0;padding:2px 0;display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:center}
  .sheet td::before{content:attr(data-label);font:500 13px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
  .sheet td.rt{display:flex;justify-content:space-between;align-items:center;padding-top:6px;margin-top:4px;border-top:1px solid var(--rule)}
  .sheet td.rt::before{content:none}
  .sheet tr.done td,.sheet tr.fresh td,.sheet tr.arch td{background:none}
  .sheet tr.done{background:#F7F4EE}
  .sheet tr.fresh{background:var(--teal-tint)}
  .sheet tr.arch{background:var(--mist)}
  .edited{font-size:13px}
  .sheet input,.sheet select,.sheet textarea{font-size:16px}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL = 'https://ybfaykwwnirjwabmgsqu.supabase.co';
var SB_KEY = 'sb_publishable__doHKn0KYVVPUnYqVdchnw_TBUq5eYy';
// ?demo runs on made-up rows in memory, on localhost only, so the live site never shows them
var DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]demo\b/.test(location.search);
// default storage key on purpose: one sign-in covers this page and /jobs
var sb = !DEMO && window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

var AREAS = ['West Linn', 'Sherwood', 'Mount Tabor area', 'Grant High area', 'Sellwood-Moreland', 'SW Washington', 'Other'];
// Jeffrey's Zillow saved searches, one per school (a rent search and a buy search for each).
// Portland first, then West Linn. load_listing_emails.py has the same list in SEARCH_AREA.
var SCHOOL_SEARCHES = ['Grant High School', 'Beaumont Middle School', 'Harrison Park School', 'Sellwood Middle School',
                       'Athey Creek Middle School', 'Rosemont Ridge Middle School'];
// The school behind each search, as a pin on the Map tab. Address as the school's own homepage gives it
// (read 8 Oct 2026), position from the Census geocoder. Athey Creek has none: the Census address data
// doesn't have 2110 Brandon Place. load_listing_emails.py --schools prints these lines from its saved answers.
var SCHOOL_PINS = [
  {search: 'Grant High School', name: 'Grant High School', short: 'Grant High', addr: '2245 NE 36th Avenue, Portland, OR 97212', url: 'https://grant.pps.net/', lat: 45.53944, lon: -122.626107},
  {search: 'Beaumont Middle School', name: 'Beaumont Middle School', short: 'Beaumont', addr: '4043 NE Fremont, Portland, OR 97212', url: 'https://beaumont.pps.net/', lat: 45.548355, lon: -122.621358},
  {search: 'Harrison Park School', name: 'Harrison Park Middle School', short: 'Harrison Park', addr: '2225 SE 87th Ave, Portland, OR 97216', url: 'https://harrisonpark.pps.net/', lat: 45.506658, lon: -122.574302},
  {search: 'Sellwood Middle School', name: 'Sellwood Middle School', short: 'Sellwood', addr: '8300 SE 15th Ave, Portland, OR 97202', url: 'https://sellwood.pps.net/', lat: 45.462838, lon: -122.650929},
  {search: 'Athey Creek Middle School', name: 'Athey Creek Middle School', short: 'Athey Creek', addr: '2110 Brandon Place, West Linn, OR 97068', url: 'https://atheycreek.wlwv.k12.or.us/'},
  {search: 'Rosemont Ridge Middle School', name: 'Rosemont Ridge Middle School', short: 'Rosemont Ridge', addr: '20001 Salamo Road, West Linn, OR 97068', url: 'https://rosemontridge.wlwv.k12.or.us/', lat: 45.36859, lon: -122.646957}
];
var PEOPLE = ['Jeffrey', 'Paige', 'Both'];

// Each sheet tab is rows in move_rows with tab = key. Column types: text, long,
// date, num, money, select (opts), check, url, who, suggest (sugg = suggestions).
var TABS = [
  {key: 'timeline', label: 'Timeline', add: 'Add a date', tasks: true,
   blurb: 'Dates and milestones for the move, in order.',
   sort: {k: 'date', dir: 1},
   cols: [
     {k: 'date', l: 'Date', t: 'date', w: 150},
     {k: 'what', l: 'What', t: 'long', w: 320},
     {k: 'who', l: 'Who', t: 'who', w: 130},
     {k: 'done', l: 'Done', t: 'check', w: 70},

}

    '<label class="fld"><span>Password</span><input type="password" id="pass" autocomplete="current-password" required></label>' +
    '<button class="btn primary" type="submit">Sign in</button></form>');
  $('#signin').onsubmit = async function(e){

    try { S.user = await api.signIn($('#email').value.trim(), $('#pass').value); boot(); }
    catch (err){ signInView(err.message || 'Sign-in failed.'); }
  };
}

async function boot(){
  if (!DEMO && !sb){ gate('<p class="eyebrow">Portland move</p><h1>Can’t load</h1><p>The sign-in code didn’t load. Check the connection and reload the page.</p>'); return; }
  try { S.user = await api.session(); } catch (e){ S.user = null; }
  if (!S.user){ signInView(); return; }
  try {
    if (!(await api.isEditor())){
      gate('<p class="eyebrow">Portland move</p><h1>Not on the list</h1><p>You’re signed in as ' + esc(S.user.email) +
        ', but this address isn’t on the board’s list yet. Jeffrey adds it in Supabase.</p><button class="btn quiet" data-act="signout">Sign out</button>');
      return;
    }
    S.rows = await api.rows();
    S.loadedAt = Date.now();
  } catch (e){
    if (e && (e.code === 'PGRST205' || e.code === '42P01')){
      gate('<p class="eyebrow">Almost there</p><h1>Portland move</h1><p>You’re signed in, but the board’s tables aren’t in the database yet. Run the setup SQL in Supabase, then reload this page.</p><button class="btn quiet" data-act="signout">Sign out</button>');
      return;
    }
    gate('<p class="eyebrow">Portland move</p><h1>Something went wrong</h1><div class="err">' + esc(e.message || e) + '</div><button class="btn quiet" data-act="signout">Sign out</button>');
    return;
  }
  renderApp();
  loadJobCounts();
}

function live(tab){ return S.rows.filter(function(r){ return r.tab === tab && !r.archived; }); }

function drawMeta(){
  var el = $('#meta'); if (!el) return;
  var t = today();
  var tl = live('timeline').filter(function(r){ return !r.data.done; })
    .sort(function(a, b){ return (a.data.date || '9999') < (b.data.date || '9999') ? -1 : 1; });
  var next = tl.filter(function(r){ return r.data.date && r.data.date >= t; })[0] || tl[0];
  var house = live('house').filter(function(r){ return !r.data.done; }).length;
  var logi = live('logistics').filter(function(r){ return !r.data.done; }).length;
  var liked = 0, toCheck = 0, saved = 0, homesTab = '';
  TABS.forEach(function(t){
    if (!t.feed) return;
    live(t.key).forEach(function(r){
      if (queued(r)){ toCheck++; if (!homesTab) homesTab = t.key; }
      else saved++;
      if (t.liked.indexOf(r.data.status) >= 0) liked++;
    });
  });
  var q = S.jobCounts ? S.jobCounts.queued : null;
  el.innerHTML =
    '<button data-go="timeline"><span class="k">Next on the timeline</span><b>' + esc(next ? (day(next.data.date) || 'No date') : 'Nothing yet') + '</b><span class="s">' + esc(next ? (next.data.what || '') : 'Add the first date') + '</span></button>' +
    '<button data-go="' + (house || !logi ? 'house' : 'logistics') + '"><span class="k">Open to-dos</span><b>' + (house + logi) + '</b><span class="s">' + house + ' house · ' + logi + ' logistics</span></button>' +
    '<button data-go="' + (homesTab || 'rentals') + '"><span class="k">Homes you like</span><b>' + liked + '</b><span class="s">' + (toCheck ? toCheck + ' new to check' : saved + ' saved in all') + '</span></button>' +
    '<button data-go="jobs"><span class="k">Jobs in the queue</span><b>' + (q == null ? '…' : q) + '</b><span class="s">From the job scan</span></button>';
}

function tabCount(t){
  if (t.map) return '';
  if (t.jobs) return S.jobCounts ? S.jobCounts.queued : '';
  var rows = live(t.key);
  if (t.tasks) rows = rows.filter(function(r){ return !r.data.done; });
  return rows.length;
}

function drawTabs(){
  var el = $('#tabs'); if (!el) return;
  el.innerHTML = TABS.map(function(t){
    var on = t.key === S.tab, n = tabCount(t);
    return '<button class="tab' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '" data-tab="' + t.key + '">' + esc(t.label) +
      (n !== '' ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
}

function goTab(key){
  if (!TAB[key]) return;
  S.tab = key; S.q = ''; S.search = ''; S.fresh = {};
  history.replaceState(null, '', '#' + key);
  drawTabs(); drawView();
  var bar = $('.tbar');
  if (bar && bar.getBoundingClientRect().top < 0) window.scrollTo({top: bar.offsetTop, behavior: 'smooth'});
}

function drawView(){
  dropMap();
  var t = TAB[S.tab];
  if (t.jobs) drawJobs(); else if (t.map) drawMapView(); else drawSheetView();
}

      AREAS.map(function(a){ return '<option' + (a === S.area ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>' : '') +
    (searches.length ? '<select id="srch" aria-label="School search"><option value="">All school searches</option>' +
      searches.map(function(v){ return '<option' + (v === S.search ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>' : '') +
    (t.tasks ? '<label class="tg"><input type="checkbox" id="hideDone"' + (S.hideDone ? ' checked' : '') + '> Hide done</label>' : '') +
    '<label class="tg"><input type="checkbox" id="showArch"' + (S.showArch ? ' checked' : '') + '> Show archived</label>' +
    '<span class="sp"></span><button class="btn quiet small" data-act="csv">Download CSV</button>' +
    '<button class="btn primary small" data-act="add">+ ' + esc(t.add) + '</button></div>' +
    '<div id="sheet"></div><div id="dls"></div>';
  drawSave(); drawSheet();

function valuesOf(tab, k){
  var out = [];
  S.rows.forEach(function(r){ var v = r.data[k]; if (r.tab === tab && v && typeof v === 'string' && out.indexOf(v) < 0) out.push(v); });
  return out.sort(function(a, b){ return a.localeCompare(b); });
}

// the search box and the Area and School search filters
function matches(t, r){
  var q = S.q.trim().toLowerCase();
  if (hasCol(t, 'area') && S.area && r.data.area !== S.area) return false;
  if (hasCol(t, 'search') && S.search && r.data.search !== S.search) return false;
  if (q){
    var hay = Object.keys(r.data).filter(function(k){ return k.charAt(0) !== '_'; }).map(function(k){ return r.data[k]; }).join(' ').toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  return true;
}

// the New list: alert homes nobody has saved or passed yet, newest first
function queueRows(t){
  if (!t.feed) return [];
  return S.rows.filter(function(r){ return r.tab === t.key && queued(r) && matches(t, r); })
    .sort(function(a, b){ return (b.data.found || '').localeCompare(a.data.found || '') || (a.created_at < b.created_at ? -1 : 1); });
}

function visibleRows(t){
  var rows = S.rows.filter(function(r){
    if (r.tab !== t.key || queued(r)) return false;
    if (S.fresh[r.id]) return true;
    if (r.archived && !S.showArch) return false;
    if (t.tasks && S.hideDone && r.data.done) return false;
    return matches(t, r);
  });
  var s = S.sort[t.key] || t.sort, col = colOf(t, s.k);
  rows.sort(function(a, b){
    var fa = S.fresh[a.id] || 0, fb = S.fresh[b.id] || 0;
    if (fa || fb) return fb - fa;
    if (a.archived !== b.archived) return a.archived ? 1 : -1;
    if (t.tasks){ var da = a.data.done ? 1 : 0, db = b.data.done ? 1 : 0; if (da !== db) return da - db; }
    return cmp(col, s.k, s.dir, a, b) || (a.created_at < b.created_at ? -1 : 1);
  });
  return rows;
}

// empty cells sort last whichever way the column is sorted
function cmp(col, k, dir, a, b){
  var va = k === '_updated' ? a.updated_at : a.data[k], vb = k === '_updated' ? b.updated_at : b.data[k];
  var t = col ? col.t : 'text';
  if (t !== 'check'){
    var ea = va == null || va === '', eb = vb == null || vb === '';
    if (ea || eb) return ea === eb ? 0 : (ea ? 1 : -1);
  }
  var r;
  if (t === 'select') r = col.opts.indexOf(va) - col.opts.indexOf(vb);
  else if (t === 'num' || t === 'money') r = Number(va) - Number(vb);
  else if (t === 'check') r = (va ? 1 : 0) - (vb ? 1 : 0);
  else r = String(va).localeCompare(String(vb), undefined, {numeric: true, sensitivity: 'base'});
  return r * dir;
}

function drawSheet(){
  var t = TAB[S.tab], box = $('#sheet'); if (!box) return;
  var rows = visibleRows(t), fresh = queueRows(t);
  var any = S.rows.some(function(r){ return r.tab === t.key && !queued(r); });
  var s = S.sort[t.key] || t.sort;
  var h = '';
  if (fresh.length){
    h += '<section class="queue" aria-label="New listings"><div class="qh"><h3>New from the alerts</h3><span class="c">' + fresh.length + '</span></div>' +
      '<div class="qgrid">' + fresh.map(function(r){ return listingCard(t, r); }).join('') + '</div></section>' +
      '<h3 class="lh">Your list</h3>';
  }
  if (!rows.length){
    h += '<div class="empty">' + (any ? 'Nothing matches. Clear the search or filters to see every row.'
      : t.feed ? 'Nothing saved yet. Save a new listing' + (fresh.length ? ' above' : '') + ', or add one below.' : 'Nothing here yet. Add the first row below.') + '</div>';
  } else {
    h += '<div class="sheet-wrap"><table class="sheet"><thead><tr>' + t.cols.map(function(c){
      var on = s.k === c.k;
      return '<th style="min-width:' + (c.w || 120) + 'px" aria-sort="' + (on ? (s.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-sort="' + c.k + '">' +
        esc(c.l) + (on ? ' <span class="arr">' + (s.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</button></th>';
    }).join('') + '<th><span class="sr">Row</span></th></tr></thead><tbody>' +
      rows.map(function(r){ return rowHtml(t, r); }).join('') + '</tbody></table></div>';
  }
  h += '<button class="addrow" data-act="add">+ ' + esc(t.add) + '</button>';
  box.innerHTML = h;
  drawLists(t);
  box.querySelectorAll('textarea').forEach(grow);
}

function rowHtml(t, r){
  var cls = [r.data.done ? 'done' : '', r.archived ? 'arch' : '', S.fresh[r.id] ? 'fresh' : ''].join(' ').trim();
  return '<tr data-id="' + esc(r.id) + '"' + (cls ? ' class="' + cls + '"' : '') + '>' +
    t.cols.map(function(c){ return cell(t, c, r.data[c.k]); }).join('') +
    '<td class="rt"><span class="edited">' + esc(edited(r)) + '</span>' +
    (r.archived ? '<button class="mini" data-act="restore">Restore</button>'
                : '<button class="mini warn" data-act="archive" aria-label="Archive this row">Archive</button>') +
    '</td></tr>';
}

function edited(r){ return r.updated_by ? whoOf(r.updated_by) + ', ' + day(r.updated_at) : ''; }

function cell(t, c, v){
  var a = ' data-k="' + c.k + '" aria-label="' + esc(c.l) + '"', inner;
  if (v == null) v = '';
  switch (c.t){
    case 'check': inner = '<input type="checkbox"' + a + (v ? ' checked' : '') + '>'; break;
    case 'select':
      inner = '<select' + a + '><option value=""></option>' + c.opts.map(function(o){
        return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('') + (v && c.opts.indexOf(v) < 0 ? '<option selected>' + esc(v) + '</option>' : '') + '</select>';
      break;
    case 'date': inner = '<input type="date"' + a + ' value="' + esc(v) + '">'; break;
    case 'num': inner = '<input type="number" inputmode="decimal" step="any"' + a + ' value="' + esc(v) + '">'; break;
    case 'money': inner = '<span class="cur">$</span><input type="number" inputmode="decimal" step="any"' + a + ' value="' + esc(v) + '">'; break;
    case 'long': inner = '<textarea rows="1"' + a + '>' + esc(v) + '</textarea>'; break;
    case 'url': inner = '<input type="url" placeholder="https://"' + a + ' value="' + esc(v) + '">' + openLink(v); break;
    case 'who': inner = '<input type="text" list="dl-who"' + a + ' value="' + esc(v) + '">'; break;
    case 'suggest': inner = '<input type="text" list="dl-' + t.key + '-' + c.k + '"' + a + ' value="' + esc(v) + '">'; break;
    default: inner = '<input type="text"' + a + ' value="' + esc(v) + '">';
  }
  return '<td data-label="' + esc(c.l) + '"><div class="cv">' + inner + '</div></td>';
}

function openLink(v){ var u = safeUrl(v); return u ? '<a class="open" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">Open</a>' : ''; }

function drawLists(t){
  var seen = {}, out = [];
  function list(id, base, key, tabKey){
    var vals = base.slice();
    S.rows.forEach(function(r){
      if (tabKey && r.tab !== tabKey) return;
      var v = r.data[key];
      if (v && typeof v === 'string' && vals.indexOf(v) < 0) vals.push(v);
    });
    out.push('<datalist id="' + id + '">' + vals.map(function(v){ return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>');
  }
  if (t.cols.some(function(c){ return c.t === 'who'; })) list('dl-who', PEOPLE, 'who', null);
  t.cols.forEach(function(c){
    if (c.t === 'suggest' && !seen[c.k]){ seen[c.k] = 1; list('dl-' + t.key + '-' + c.k, c.sugg || [], c.k, t.key); }
  });
  $('#dls').innerHTML = out.join('');

function grow(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + 3) + 'px'; }

/* ---------- saving ---------- */

function drawSave(){
  var el = $('#save'); if (!el) return;
  el.className = 'save' + (S.saveErr ? ' bad' : '');
  el.textContent = S.saveErr ? 'Not saved: ' + S.saveErr : S.saving ? 'Saving…' : 'All changes saved';
}

// Read the row fresh, keep the earlier version, then change only what was edited,
// so two people editing different cells of the same row don't undo each other.
// Saves to one row run one after another, so tabbing quickly through its cells
// can't make a later save start from a copy read before an earlier one landed.
var rowQueue = {};
function mutate(id, change){
  var run = function(){ return mutateNow(id, change); };
  var p = (rowQueue[id] || Promise.resolve()).then(run, run);
  rowQueue[id] = p.catch(function(){});
  return p;
}

async function mutateNow(id, change){
  S.saving++; S.saveErr = ''; drawSave();
  try {
    var cur = await api.row(id);
    await api.version(cur, S.user.email);
    var body = change(cur);
    body.updated_by = S.user.email;
    var row = await api.update(id, body);
    for (var i = 0; i < S.rows.length; i++) if (S.rows[i].id === id) S.rows[i] = row;
    return row;
  } catch (e){
    S.saveErr = (e && e.message) || 'check the connection and try again';
    throw e;
  } finally {
    S.saving--; drawSave();
  }
}

async function saveCell(id, k, v){
  var row = await mutate(id, function(cur){
    var d = Object.assign({}, cur.data);
    if (v === '' || v === false || v == null) delete d[k]; else d[k] = v;
    return {data: d};
  });
  var tr = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
  if (tr){ var ed = $('.edited', tr); if (ed) ed.textContent = edited(row); }
  drawMeta(); drawTabs();
}

async function addRow(){
  var t = TAB[S.tab], data = Object.assign({}, t.defaults || {});
  if (S.area && hasCol(t, 'area')) data.area = S.area;
  if (S.search && hasCol(t, 'search')) data.search = S.search;
  try {
    S.saving++; S.saveErr = ''; drawSave();
    var r = await api.add(t.key, S.user.email, data);
    S.rows.push(r); S.fresh[r.id] = Date.now();
  } catch (e){
    S.saveErr = (e && e.message) || 'could not add a row'; return;
  } finally { S.saving--; drawSave(); }
  drawSheet(); drawTabs(); drawMeta();
  // the cursor goes to the row's first written field (What, Address, Task), not a date picker
  var tr = document.querySelector('tr[data-id="' + CSS.escape(r.id) + '"]');
  var first = tr && tr.querySelector('textarea, input[type=text], input[type=url]');
  if (first) first.focus();
}

async function setArchived(id, flag){
  try { await mutate(id, function(){ return {archived: flag}; }); } catch (e){ return; }
  delete S.fresh[id];
  drawSheet(); drawTabs(); drawMeta();
  if (flag) toast('Row archived.', function(){ setArchived(id, false); });
}

// Save keeps a home (status Like, so it moves to the list below). Pass sets it to
// Passed and archives it. Both can be undone, and both go through mutate like any edit.
async function listAction(id, act){
  var before = null;
  try {
    await mutate(id, function(cur){
      before = {status: cur.data.status, archived: cur.archived};
      var d = Object.assign({}, cur.data, {status: act === 'save' ? 'Like' : 'Passed'});
      return act === 'save' ? {data: d} : {data: d, archived: true};
    });
  } catch (e){ toast('Could not save: ' + ((e && e.message) || 'check the connection and try again')); redraw(); return; }
  if (act === 'save') S.fresh[id] = Date.now();
  redraw();
  var onMap = !!TAB[S.tab].map;
  toast(act === 'save' ? (onMap ? 'Saved.' : 'Saved. It’s in the list below.') : (onMap ? 'Passed. It’s off the map.' : 'Passed. Show archived brings it back.'),
    function(){ undoListAction(id, before); });
}

async function undoListAction(id, before){
  try {
    await mutate(id, function(cur){
      var d = Object.assign({}, cur.data);
      if (before.status) d.status = before.status; else delete d.status;
      return {data: d, archived: !!before.archived};
    });
  } catch (e){ return; }
  delete S.fresh[id];
  redraw();
}

  });
}

function drawMapView(){
  var extra = valuesOf('rentals', 'search').concat(valuesOf('buy', 'search')).filter(function(v, i, a){ return SCHOOL_SEARCHES.indexOf(v) < 0 && a.indexOf(v) === i; });
  $('#view').innerHTML =
    '<div class="head"><h2>Map</h2></div>' +
    '<p class="blurb">Rentals and houses to buy, with the schools behind the six searches. Click a pin for the details. New homes can be saved or passed right here.</p>' +
    '<div class="tools"><div class="seg" role="group" aria-label="Homes shown">' + MAP_KINDS.map(function(k){
      return '<button type="button" data-mapkind="' + k[0] + '" aria-pressed="' + (S.mapKind === k[0]) + '">' + esc(k[1]) + '</button>';
    }).join('') + '</div>' +
    '<select id="srch" aria-label="School search"><option value="">All school searches</option>' +
      SCHOOL_SEARCHES.concat(extra).map(function(v){ return '<option' + (v === S.search ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>' +
    '<label class="tg"><input type="checkbox" id="mapSchools"' + (S.mapSchools ? ' checked' : '') + '> Schools</label></div>' +
    '<div class="mapwrap"><div id="map" class="mapbox" role="region" aria-label="Map of the homes and schools"></div></div>' +
    '<div class="legend" aria-hidden="true"><span><span class="pin rent new"><i></i></span>Rental, new</span><span><span class="pin rent"><i></i></span>Rental, saved</span>' +
    '<span><span class="pin buy new"><i></i></span>For sale, new</span><span><span class="pin buy"><i></i></span>For sale, saved</span>' +
    '<span><span class="pin school"><i></i></span>School</span></div>' +
    '<p class="mapnote" id="mapnote"></p>';
  mapNote();
  startMap();
}

function startMap(){
  var gen = ++M.gen, box = $('#map');
  if (!box) return;
  if (!('WebGLRenderingContext' in window)){ mapMsg('This browser can’t draw the map.'); return; }
  Promise.all([mapLib(), mapStyle()]).then(function(r){
    if (gen !== M.gen || !document.body.contains(box)) return;
    var gl = r[0];
    var map = new gl.Map({container: box, style: r[1], bounds: MAP_BOX, fitBoundsOptions: {padding: 30}, maxZoom: 18,
      maxPitch: 0, dragRotate: false, pitchWithRotate: false, touchPitch: false});
    map.touchZoomRotate.disableRotation();
    map.keyboard.disableRotation();
    map.addControl(new gl.NavigationControl({showCompass: false}), 'top-right');
    M.map = map; M.gl = gl; M.fitted = false;
    drawPins(true);
  }).catch(function(){ if (gen === M.gen) mapMsg('The map didn’t load. Check the connection, then open the tab again.'); });
}
function mapMsg(text){ var w = $('.mapwrap'); if (w) w.insertAdjacentHTML('beforeend', '<div class="mapmsg">' + esc(text) + '</div>'); }
function dropMap(){
  M.gen++;
  if (M.map){ try { M.map.remove(); } catch (e){} }
  M.map = null; M.markers = [];
}

// every pin again (after a filter or a Save or Pass); fit moves the view to take them all in
function drawPins(fit){
  mapNote();
  var map = M.map, gl = M.gl;
  if (!map) return;
  M.markers.forEach(function(m){ m.remove(); });
  M.markers = [];
  var pts = [], seen = {};
  function add(el, lon, lat, html, label){
    var at = lon.toFixed(5) + ',' + lat.toFixed(5), nth = seen[at] = (seen[at] || 0) + 1;
    el.setAttribute('aria-label', label);
    el.setAttribute('role', 'button');
    var pop = new gl.Popup({offset: 14, maxWidth: '320px'}).setHTML(html);
    M.markers.push(new gl.Marker({element: el, offset: nth > 1 ? [Math.round(Math.cos(nth * 2.3) * 12), Math.round(Math.sin(nth * 2.3) * 12)] : [0, 0]})
      .setLngLat([lon, lat]).setPopup(pop).addTo(map));
  }
  if (S.mapSchools) SCHOOL_PINS.forEach(function(sc){
    if (sc.lat == null) return;
    var off = S.search && S.search !== sc.search;
    var el = document.createElement('div');
    el.className = 'pin school' + (off ? ' dim' : '');
    el.innerHTML = '<i></i><span>' + esc(sc.short) + '</span>';
    add(el, sc.lon, sc.lat, schoolPop(sc), 'School: ' + sc.name);
    if (!off) pts.push([sc.lon, sc.lat]);
  });
  // saved homes first, so the new ones sit on top
  mapHomes().filter(placed).sort(function(a, b){ return (queued(a) ? 1 : 0) - (queued(b) ? 1 : 0); }).forEach(function(r){
    var rent = r.tab === 'rentals', isNew = queued(r), price = money(rent ? r.data.rent : r.data.price);
    var el = document.createElement('div');
    el.className = 'pin ' + (rent ? 'rent' : 'buy') + (isNew ? ' new' : '');
    el.innerHTML = '<i></i>';
    add(el, r.data._lon, r.data._lat, homePop(r), (rent ? 'Rental' : 'For sale') + (isNew ? ', new: ' : ': ') + (r.data.address || '') + (price ? ', ' + price + (rent ? ' a month' : '') : ''));
    pts.push([r.data._lon, r.data._lat]);
  });
  if (fit && pts.length){
    var b = pts.reduce(function(a, q){ return [Math.min(a[0], q[0]), Math.min(a[1], q[1]), Math.max(a[2], q[0]), Math.max(a[3], q[1])]; }, [180, 90, -180, -90]);
    map.fitBounds(b, {padding: {top: 50, bottom: 60, left: 40, right: 110}, maxZoom: 14, duration: M.fitted ? 600 : 0});
    M.fitted = true;
  }
}

function homePop(r){
  var d = r.data, rent = r.tab === 'rentals', u = safeUrl(d.link), isNew = queued(r), price = money(rent ? d.rent : d.price);
  var facts = [price ? price + (rent ? '/mo' : '') : '', d.beds != null && d.beds !== '' ? d.beds + ' bd' : '',
    d.baths != null && d.baths !== '' ? d.baths + ' ba' : '', d.sqft ? Number(d.sqft).toLocaleString('en-US') + ' sq ft' : '', d.pets ? 'pets OK' : ''];
  return '<div class="pop" data-lid="' + esc(r.id) + '"><p class="pk">' + (rent ? 'Rental' : 'For sale') + ' · ' + esc(isNew ? 'new' : (d.status || 'saved')) + '</p>' +
    '<h3>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(d.address) + '</a>' : esc(d.address)) + '</h3>' +
    '<p class="lp">' + facts.filter(Boolean).map(esc).join(' · ') + '</p>' +
    (d.open ? '<p class="lx"><span class="pill">Open house</span> ' + esc(d.open) + '</p>' : '') +
    (d.cut ? '<p class="lx"><span class="pill">Price cut</span> ' + esc(d.cut) + '</p>' : '') +
    '<p class="jm">' + [d.search ? d.search + ' search' : '', d.found ? 'found ' + day(d.found) : ''].filter(Boolean).map(esc).join(' · ') + '</p>' +
    (isNew ? '<div class="acts"><button class="btn small primary" data-list="save">Save</button><button class="btn small quiet" data-list="pass">Pass</button></div>' : '') +
    '<p class="pl">' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">Open on ' + esc(FEEDS[r.source] || 'the listing') + '</a>' : '') +
    '<button type="button" class="lnk" data-showrow="' + esc(r.id) + '">Show in ' + esc(TAB[r.tab].label) + '</button></p></div>';
}

function schoolPop(sc){
  var n = S.rows.filter(function(r){ return (r.tab === 'rentals' || r.tab === 'buy') && !r.archived && r.data.status !== 'Passed' && r.data.search === sc.search; }).length;
  var only = S.search === sc.search;
  return '<div class="pop"><p class="pk">School</p><h3><a href="' + esc(sc.url) + '" target="_blank" rel="noopener noreferrer">' + esc(sc.name) + '</a></h3>' +
    '<p class="lx">' + esc(sc.addr) + '</p><p class="jm">' + n + ' home' + (n === 1 ? '' : 's') + ' from the ' + esc(sc.search) + ' search</p>' +
    '<div class="acts"><button class="btn small quiet" data-mapsearch="' + esc(only ? '' : sc.search) + '">' + (only ? 'Show every search' : 'Show only this search') + '</button></div></div>';
}

// under the map: what's on it, and what isn't and why
function mapNote(){
  var el = $('#mapnote'); if (!el) return;
  var hs = mapHomes(), on = hs.filter(placed).length;
  var noStreet = hs.filter(function(r){ return !placed(r) && !hasStreet(r); }).length;
  var tried = hs.filter(function(r){ return !placed(r) && hasStreet(r) && r.data._geo === r.data.address; });
  var waiting = hs.filter(function(r){ return !placed(r) && hasStreet(r) && r.data._geo !== r.data.address; }).length;
  var out = [on + ' home' + (on === 1 ? '' : 's') + ' on the map.'];
  if (noStreet) out.push(noStreet + ' without a street address, so no pin.');
  if (waiting) out.push(waiting + ' not placed yet: ' + (waiting === 1 ? 'it gets' : 'they get') + ' a pin the next time listings are loaded.');
  if (tried.length) out.push('The address lookup couldn’t place ' + tried.map(function(r){ return r.data.address; }).join('; ') + '.');
  var noSchool = S.mapSchools ? SCHOOL_PINS.filter(function(sc){ return sc.lat == null && (!S.search || S.search === sc.search); }) : [];
  if (noSchool.length) out.push(noSchool.map(function(sc){ return sc.name; }).join(', ') + ' isn’t on the map: the Census address data doesn’t have ' + noSchool.map(function(sc){ return sc.addr.split(',')[0]; }).join(', ') + '.');
  el.textContent = out.join(' ');
}

// from a pin to the home's own tab: a new one is in the New list, a saved one is lit at the top of the sheet
function showRow(id){
  var r = S.rows.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  S.area = '';
  goTab(r.tab);
  var isNew = queued(r);
  if (!isNew){ S.fresh[id] = Date.now(); drawSheet(); }
  var el = document.querySelector(isNew ? '.queue [data-lid="' + CSS.escape(id) + '"]' : 'tr[data-id="' + CSS.escape(id) + '"]');
  if (el){ el.classList.add('hl'); el.scrollIntoView({block: 'center'}); }
}

/* ---------- CSV ---------- */

function downloadCsv(){
  var t = TAB[S.tab], rows = queueRows(t).concat(visibleRows(t));
  function q(v){ v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var lines = [t.cols.map(function(c){ return c.l; }).concat(['Last edited by', 'Last edited'])];
  rows.forEach(function(r){
    lines.push(t.cols.map(function(c){ var v = r.data[c.k]; return c.t === 'check' ? (v ? 'yes' : '') : v; })
      .concat([whoOf(r.updated_by), (r.updated_at || '').slice(0, 10)]));
  });
  var blob = new Blob(['﻿' + lines.map(function(l){ return l.map(q).join(','); }).join('\r\n')], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'portland-move-' + t.key + '-' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------- jobs ---------- */

async function loadJobCounts(){
  try {
    var c = await Promise.all([api.jobCount(['queued']), api.jobCount(['applied', 'user_rejected']), api.oppCount()]);
    S.jobCounts = {queued: c[0], decided: c[1], opps: c[2]};
  } catch (e){ S.jobCounts = null; }
  drawMeta(); drawTabs(); drawJobChips();
}

function drawJobs(){
  $('#view').innerHTML = '<div class="head"><h2>Jobs</h2></div>' +
    '<p class="blurb">The job scan’s queue. Applied or Pass moves a job to Decided. Opportunities are grants and other leads.</p>' +
    '<div class="chips" id="jchips"></div><div id="jlist"><p class="blurb">Loading…</p></div>';
  drawJobChips(); loadJobList();
}

function drawJobChips(){
  var el = $('#jchips'); if (!el) return;
  var c = S.jobCounts || {};
  el.innerHTML = [['queued', 'Queued', c.queued], ['decided', 'Decided', c.decided], ['opps', 'Opportunities', c.opps]].map(function(x){
    return '<button class="chip' + (S.jobsView === x[0] ? ' on' : '') + '" data-jview="' + x[0] + '">' + x[1] +
      (x[2] != null ? '<span class="c">' + x[2] + '</span>' : '') + '</button>';
  }).join('');
}

async function loadJobList(){
  var view = S.jobsView, el = $('#jlist');
  try {
    var list = view === 'opps' ? await api.opps()
      : await api.jobs(view === 'queued' ? ['queued'] : ['applied', 'user_rejected'], view === 'queued' ? 200 : 100);
    if (S.tab !== 'jobs' || S.jobsView !== view || !$('#jlist')) return;
    el = $('#jlist');
    if (!list.length){ el.innerHTML = '<div class="empty">' + (view === 'queued' ? 'The queue is empty. Run jobscan to look for new postings.' : 'Nothing here.') + '</div>'; return; }
    el.innerHTML = list.map(view === 'opps' ? oppCard : jobCard).join('');
  } catch (e){
    if ($('#jlist')) $('#jlist').innerHTML = '<div class="err">Could not load the jobs: ' + esc(e.message || e) + '</div>';
  }
}

function fmtSalary(j){
  if (j.salary_min && j.salary_max) return '$' + Math.round(j.salary_min / 1000) + 'K-$' + Math.round(j.salary_max / 1000) + 'K';
  return j.salary_raw ? String(j.salary_raw).slice(0, 50) : '';
}

function jobCard(j){
  var u = safeUrl(j.canonical_url);
  var meta = [j.employer_name, j.location || 'location unlisted', fmtSalary(j)].filter(Boolean).map(esc).join(' · ');
  var pill = j.status === 'applied' ? '<span class="pill">Applied</span> ' : j.status === 'user_rejected' ? '<span class="pill">Passed</span> ' : '';
  var acts = j.status === 'queued'
    ? '<button class="btn small primary" data-job="applied" data-id="' + j.id + '">Applied</button><button class="btn small quiet" data-job="user_rejected" data-id="' + j.id + '">Pass</button>'
    : '<button class="btn small quiet" data-job="queued" data-id="' + j.id + '">Back to the queue</button>';
  return '<article class="job" data-card="' + j.id + '" data-status="' + esc(j.status) + '"><h3>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(j.title) + '</a>' : esc(j.title)) +
    '</h3><p class="jm">' + pill + meta + '</p><div class="acts">' + acts + '</div></article>';
}

function oppCard(o){
  var u = safeUrl(o.url);
  var meta = [o.org, o.location, o.deadline ? 'due ' + day(o.deadline) : 'rolling'].filter(Boolean).map(esc).join(' · ');
  return '<article class="job" data-card="' + o.id + '"><h3>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(o.title) + '</a>' : esc(o.title)) +
    '</h3><p class="jm"><span class="pill">' + esc(o.kind) + '</span> <span class="pill">' + esc(o.status) + '</span> ' + meta + '</p>' +
    (o.description ? '<p class="jd">' + esc(o.description) + '</p>' : '') +
    '<div class="acts"><button class="btn small quiet" data-opp="watch" data-id="' + o.id + '">Watch</button>' +
    '<button class="btn small primary" data-opp="pursue" data-id="' + o.id + '">Pursue</button>' +
    '<button class="btn small quiet" data-opp="dismissed" data-id="' + o.id + '">Dismiss</button></div></article>';
}

async function jobAction(id, status, prev){
  try { await api.setJob(id, status); } catch (e){ toast('Could not save: ' + (e.message || e)); return; }
  var card = document.querySelector('[data-card="' + id + '"]'); if (card) card.remove();
  var words = {applied: 'Marked applied.', user_rejected: 'Passed.', queued: 'Back in the queue.'};
  toast(words[status] || 'Saved.', prev ? function(){ jobAction(id, prev, null).then(loadJobList); } : null);
  loadJobCounts();
}

async function oppAction(id, status){
  try { await api.setOpp(id, status); } catch (e){ toast('Could not save: ' + (e.message || e)); return; }
  if (status === 'dismissed'){ var card = document.querySelector('[data-card="' + id + '"]'); if (card) card.remove(); }
  else loadJobList();
  toast(status === 'dismissed' ? 'Dismissed.' : 'Saved.');
  loadJobCounts();
}

/* ---------- small things ---------- */

var toastTimer;
function toast(msg, undo){
  var el = $('#toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) el.querySelector('button').onclick = function(){ el.remove(); undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if (el.parentNode) el.remove(); }, 7000);
}

var qTimer;
document.addEventListener('click', async function(e){
  var b = e.target.closest('button, [data-act]'); if (!b) return;
  if (b.dataset.tab){ goTab(b.dataset.tab); return; }
  if (b.dataset.go){ goTab(b.dataset.go); return; }
  if (b.dataset.sort){
    var t = TAB[S.tab], s = S.sort[t.key] || t.sort;
    S.sort[t.key] = {k: b.dataset.sort, dir: s.k === b.dataset.sort ? -s.dir : 1};
    drawSheet(); return;
  }
  if (b.dataset.jview){ S.jobsView = b.dataset.jview; drawJobChips(); $('#jlist').innerHTML = '<p class="blurb">Loading…</p>'; loadJobList(); return; }
  if (b.dataset.job){
    var card = b.closest('[data-card]');
    b.disabled = true;
    jobAction(Number(b.dataset.id), b.dataset.job, card ? card.dataset.status : null); return;
  }
  if (b.dataset.opp){ b.disabled = true; oppAction(Number(b.dataset.id), b.dataset.opp); return; }
  if (b.dataset.list){
    var lc = b.closest('[data-lid]'); if (!lc) return;
    lc.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
    listAction(lc.dataset.lid, b.dataset.list); return;
  }
  if (b.dataset.mapkind){
    S.mapKind = b.dataset.mapkind;
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
    drawPins(true); return;
  }
  if (b.hasAttribute('data-mapsearch')){
    S.search = b.getAttribute('data-mapsearch');
    var sel = $('#srch'); if (sel) sel.value = S.search;
    drawPins(true); return;
  }
  if (b.dataset.showrow){ showRow(b.dataset.showrow); return; }
  var act = b.dataset.act; if (!act) return;
  if (act === 'signout'){ await api.signOut(); S.user = null; signInView(); return; }
  if (act === 'add'){ addRow(); return; }
  if (act === 'csv'){ downloadCsv(); return; }
  var tr = b.closest('tr[data-id]');
  if (tr && act === 'archive'){ setArchived(tr.dataset.id, true); return; }
  if (tr && act === 'restore'){ setArchived(tr.dataset.id, false); return; }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'area'){ S.area = el.value; drawSheet(); return; }
  if (el.id === 'srch'){ S.search = el.value; if (TAB[S.tab].map) drawPins(true); else drawSheet(); return; }
  if (el.id === 'mapSchools'){ S.mapSchools = el.checked; drawPins(false); return; }
  if (el.id === 'hideDone'){ S.hideDone = el.checked; drawSheet(); return; }
  if (el.id === 'showArch'){ S.showArch = el.checked; drawSheet(); return; }
  var k = el.dataset && el.dataset.k, tr = el.closest && el.closest('tr[data-id]');
  if (!k || !tr) return;
  var c = colOf(TAB[S.tab], k), v;
  if (el.type === 'checkbox') v = el.checked;
  else if (c.t === 'num' || c.t === 'money') v = el.value === '' ? '' : (isNaN(Number(el.value)) ? el.value : Number(el.value));
  else if (c.t === 'long') v = el.value.replace(/\s+$/, '');
  else v = el.value.trim();
  if (k === 'done') tr.classList.toggle('done', !!v);
  if (c.t === 'url'){ var old = $('.open', el.parentNode); if (old) old.remove(); el.insertAdjacentHTML('afterend', openLink(v)); }
  saveCell(tr.dataset.id, k, v).catch(function(){});
});

document.addEventListener('input', function(e){
  if (e.target.tagName === 'TEXTAREA') grow(e.target);
  if (e.target.id === 'q'){
    S.q = e.target.value;
    clearTimeout(qTimer); qTimer = setTimeout(drawSheet, 150);
  }
});

window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (TAB[h] && h !== S.tab && $('#tabs')) goTab(h); });

// Coming back to the tab picks up what the other person changed, unless you're mid-edit.
document.addEventListener('visibilitychange', async function(){
  if (document.visibilityState !== 'visible' || !S.user || !S.loadedAt || !$('#tabs')) return;
  if (Date.now() - S.loadedAt < 30000) return;
  var a = document.activeElement;
  if (a && a.closest && a.closest('#sheet')) return;
  try {
    S.rows = await api.rows(); S.loadedAt = Date.now();
    drawMeta(); drawTabs();
    if (TAB[S.tab].map) drawPins(false); else if (!TAB[S.tab].jobs) drawSheet(); else loadJobCounts();
  } catch (e){}
});

boot();
</script>
